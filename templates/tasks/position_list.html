{% extends "base.html" %}

{% block content %}
 <div class="d-flex justify-content-between align-items-center">
  <h1 class="mb-0">Position list</h1>

  <a href="{% url 'tasks:position-create' %}"
     class="btn btn-dark rounded-circle btn-lg">
    +
  </a>
</div>
  {% if position_list %}
  <table class="table table-striped table-hover align-middle">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>

    {% for position in position_list %}
        <tr>
          <td>
              {{ position.id }}
          </td>
          <td>
              {{ position.name }}
          </td>
          <td>
              <a href="{% url 'tasks:position-update' pk=position.id %}"
                 class="btn btn-secondary">
                UPDATE
              </a>
          </td>
          <td>
              <a href="{% url 'tasks:position-delete' pk=position.id %}"
                 class="btn btn-danger">
                DELETE
              </a>
          </td>
      </tr>
    {% endfor %}
  </table>
  {% else %}
    <p>There are no positions!</p>
  {% endif %}
{% endblock %}
