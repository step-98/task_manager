{% extends "base.html" %}

{% block content %}
  <h1>Delete Task</h1>
  <p><i>Do you really want to delete the task: {{ task }}?</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a class="btn btn-secondary" href="{% url 'tasks:task-list' %}">Cancel</a>
  </form>
{% endblock %}
