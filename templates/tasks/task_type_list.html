{% extends "base.html" %}

{% block content %}
  <div class="card card-body blur shadow-blur mx-3 mx-md-4 mt-4 ">
    <div class="d-flex justify-content-between align-items-center">
      <h1 class="mb-0">Task Type list</h1>

      <a href="{% url 'tasks:task-type-create' %}"
         class="btn btn-dark rounded-circle btn-lg">
        +
      </a>
    </div>
    {% if task_type_list %}
      <table class="table table-striped table-hover align-middle">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>

        {% for task_type in task_type_list %}
          <tr>
            <td>
              {{ task_type.id }}
            </td>
            <td>
              {{ task_type.name }}
            </td>
            <td>
              <a href="{% url 'tasks:task-type-update' pk=task_type.id %}"
                 class="btn btn-secondary">
                UPDATE
              </a>
            </td>
            <td>
              <a href="{% url 'tasks:task-type-delete' pk=task_type.id %}"
                 class="btn btn-danger">
                DELETE
              </a>
            </td>
          </tr>
        {% endfor %}
      </table>
    {% else %}
      <p>There are no task types/p>
    {% endif %}
  </div>
{% endblock %}
